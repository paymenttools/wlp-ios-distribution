# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Package Integration Test

on:
  pull_request:
    branches: [ main, develop ]

env:
  # ---- adjust these to your project ----
  WORKSPACE_ARGS: "-project Examples/AlternativeOnboarding/AlternativeOnboarding.xcodeproj"   # or: -workspace X.xcworkspace
  SCHEME: "AlternativeOnboarding"
  DESTINATION: "platform=iOS Simulator,name=iPhone 16,OS=latest"
  XCODE_VERSION: "27.2.0"
  # --------------------------------------
  DERIVED_DATA: ${{ github.workspace }}/.derivedData
  LOG_DIR: ${{ github.workspace }}/ci-logs
  RESULT_BUNDLE: ${{ github.workspace }}/ci-logs/TestResults.xcresult
  NSUnbufferedIO: "YES"   # keeps xcodebuild output in order when piped
  
defaults:
  run:
    # Explicit `bash` => GitHub runs it with `-eo pipefail`, so a failing
    # xcodebuild is not masked by `| tee | xcbeautify`.
    shell: bash

jobs:
  Tests:

    runs-on: xcode-27
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set Xcode version
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: "$XCODE_VERSION"

      - name: Trust Swift package plugins
        run: defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES

      - name: Switch Example To Use Local Package
        run: ./switch-package-source.sh local

      # Printed up front so a failure can be tied to the toolchain/simulator
      # without re-running the job.
      - name: Environment info
        run: |
          {
            echo "### Environment"
            echo '```'
            xcodebuild -version
            swift --version 2>&1 | head -2
            echo "Runner image: ${ImageOS:-?} ${ImageVersion:-?}"
            echo "Destination:  $DESTINATION"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          xcrun simctl list devices available | grep -i iphone || true
      
      # Phase 1 - dependency resolution (binary target checksum, auth,
      # version conflicts fail here, not somewhere inside the build).
      - name: "Phase 1: Resolve packages"
        id: resolve
        run: |
          xcodebuild -resolvePackageDependencies \
            $WORKSPACE_ARGS -scheme "$SCHEME" \
            -derivedDataPath "$DERIVED_DATA" \
            2>&1 | tee "$LOG_DIR/1-resolve.log"

      - name: Test iOS Simulator
        run: |
            xcodebuild -project Examples/AlternativeOnboarding/AlternativeOnboarding.xcodeproj \
              -scheme AlternativeOnboarding \
              -destination "generic/platform=iOS Simulator" build \
              2>&1 | tee "$LOG_DIR/2-build.log" \
                 | xcbeautify --renderer github-actions

      - name: Test iOS Device
        run: |
            xcodebuild \
              -project Examples/AlternativeOnboarding/AlternativeOnboarding.xcodeproj \
              -scheme AlternativeOnboarding \
              -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO \
              clean build \
              2>&1 | tee "$LOG_DIR/2-build.log" \
                 | xcbeautify --renderer github-actions
